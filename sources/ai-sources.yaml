financial_ai_sources:
  global:
    - BIS Innovation Hub:
        site: "https://www.bis.org/about/bisih/topics/suptech_regtech.htm"
        focus: "央行创新、suptech/regtech、金融监管 AI、金融市场基础设施"
    - FSB AI in finance:
        site: "https://www.fsb.org/2024/11/fsb-assesses-the-financial-stability-implications-of-artificial-intelligence/"
        focus: "AI 对金融稳定、模型风险、第三方依赖与监管协调的影响"
    - IOSCO AI/capital markets:
        site: "https://www.iosco.org/library/pubdocs/pdf/IOSCOPD788.pdf"
        focus: "资本市场 AI 用例、风险、治理、市场中介与资管应用"
  mainland_china:
    - 中国人民银行金融科技规划:
        site: "https://www.pbc.gov.cn/zhengwugongkai/4081330/4406346/4693549/4470403/index.html"
        focus: "金融科技规划、智能金融、金融服务全生命周期智能化"
    - 国家金融监督管理总局数字金融/科技监管:
        site: "https://www.nfra.gov.cn/"
        focus: "银行保险机构数字金融、人工智能安全应用、模型风险与科技监管"
    - 中国证监会数字金融与资本市场政策:
        site: "https://www.csrc.gov.cn/"
        focus: "资本市场数字化智能化、监管科技、证券期货行业 AI 应用"
    - 上交所/深交所官方动态:
        sse: "https://www.sse.com.cn/"
        szse: "https://www.szse.cn/"
        focus: "交易所 AI 活动、金融科技创新试点、监管科技与上市公司 AI 落地"
  media:
    - Reuters Fintech/AI
    - Bloomberg AI in Finance
    - Financial Times AI in Finance
    - 财新 金融科技/数字金融
    - 证券时报 金融科技


industry_ai_adoption_sources:
  developer_platforms:
    - OpenAI Developers:
        site: "https://platform.openai.com/docs/overview"
        focus: "API、SDK、工具调用、Agent 与开发者平台更新"
    - Anthropic Docs:
        site: "https://docs.anthropic.com/"
        focus: "Claude API、模型能力、工具使用与企业部署更新"
    - Google AI Developers:
        site: "https://ai.google.dev/"
        focus: "Gemini API、开发者工具、开源模型与示例"
    - Microsoft AI Developer Blog:
        site: "https://devblogs.microsoft.com/"
        focus: "Copilot、Azure AI、开发者工具链与 Agent 平台"
  enterprise_and_vertical_ai:
    - AWS Machine Learning Blog:
        site: "https://aws.amazon.com/blogs/machine-learning/"
        focus: "企业 AI 落地、模型服务、MLOps 与云端推理"
    - NVIDIA AI Enterprise:
        site: "https://blogs.nvidia.com/blog/category/enterprise/"
        focus: "企业 AI 软件、推理、数据中心与行业部署"
    - MIT Technology Review AI:
        site: "https://www.technologyreview.com/topic/artificial-intelligence/"
        focus: "AI 研究、产品化、产业采用与风险"
  banking_and_finance_ai:
    - HSBC and AI:
        site: "https://www.hsbc.com/who-we-are/hsbc-and-digital/hsbc-and-ai"
        focus: "银行生成式 AI、客户服务、员工工具、市场洞察、模型治理与 Mistral AI 等合作"
    - HSBC Wealth Intelligence:
        site: "https://www.privatebanking.hsbc.com/media-releases-and-news/hsbc-deploys-wealth-intelligence/"
        focus: "私人银行面向客户经理和投资顾问的生成式 AI 服务与知识检索"
    - Bank of America Erica:
        site: "https://info.bankofamerica.com/en/digital-banking/erica"
        focus: "AI 虚拟金融助手、客户服务、账户管理、交易检索、提醒和 Merrill 场景"
    - DBS AI banking:
        site: "https://www.dbs.com/artificial-intelligence-machine-learning/artificial-intelligence/ethical-and-responsible-ai-in-banking.html"
        focus: "AI 银行、客户服务助手、负责任 AI、风控、运营效率和治理框架"
    - JPMorganChase AI:
        site: "https://www.jpmorganchase.com/about/technology/news/jpmc-evident-25"
        focus: "银行 AI 采用成熟度、内部 AI 工具、客户与员工应用、治理和透明度"
  regulated_industries:
    - BIS Innovation Hub:
        site: "https://www.bis.org/about/bisih/topics/suptech_regtech.htm"
        focus: "仅在出现可验证 AI 系统、监管科技、模型风险治理或行业采用时引用"
    - FSB AI in finance:
        site: "https://www.fsb.org/2024/11/fsb-assesses-the-financial-stability-implications-of-artificial-intelligence/"
        focus: "仅用于 AI 模型风险、第三方依赖、治理或金融机构 AI 采用，不用于行情或利率叙事"
    - IOSCO AI/capital markets:
        site: "https://www.iosco.org/library/pubdocs/pdf/IOSCOPD788.pdf"
        focus: "仅用于资本市场中的 AI 用例与治理，不用于指数、股价或交易结论"


equity_discovery_rules:
  principle: "Do not hardcode a daily stock watchlist. Select tickers only when the current report window has verified, material evidence."
  eligible_triggers:
    - exchange_listing_or_delisting
    - SEC_or_HKEX_filing
    - company_IR_or_press_release
    - earnings_or_guidance
    - major_order_or_supply_chain_disclosure
    - financing_or_debt_offering
    - merger_acquisition_or_reorganization
    - material_regulatory_or_litigation_event
    - abnormal_price_or_volume_confirmed_by_market_media
    - index_inclusion_or_constituent_change
  discovery_segments:
    - us_large_cap_ai_and_semiconductors
    - us_software_cloud_and_consumer_platforms
    - us_recent_and_upcoming_ipos
    - us_ai_infrastructure_and_private_company_liquidity_events
    - hk_ai_cloud_internet_and_platforms
    - hk_ev_robotics_semiconductors_and_hardware
    - hk_recent_and_upcoming_ipos
  exclusion_rules:
    - "Do not include a company only because it appeared in an old watchlist."
    - "Do not include a company only because a prompt names a person, founder, or celebrity."
    - "If the evidence is only social media, label it unverified and do not make it a top item."

priority_topics:
  - earnings
  - guidance
  - financing
  - ipo
  - recent_ipos
  - upcoming_ipos
  - ipo_watch_rating
  - merger_acquisition
  - regulation
  - major_orders
  - supply_chain
  - pre_market_after_hours_move
  - hkex_announcement

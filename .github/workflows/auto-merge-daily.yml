name: Auto-merge daily reports to main

# Backup path when Cursor Automation only pushes cursor/* branches.
# Primary path: agent runs scripts/publish_to_main.sh after generating reports.

on:
  push:
    branches:
      - "cursor/**"
    paths:
      - "**.html"
      - "index.html"
      - "tmp/**"

permissions:
  contents: write

concurrency:
  group: auto-merge-daily
  cancel-in-progress: false

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect daily report HTML in this push
        id: detect
        run: |
          set -euo pipefail
          if git show --name-only --format= HEAD | grep -qE '^[0-9]{4}-[0-9]{2}/(AI|STOCK)/[0-9]{8}\.html$'; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
            REPORT_DATE="$(git show --name-only --format= HEAD | grep -E '^[0-9]{4}-[0-9]{2}/(AI|STOCK)/[0-9]{8}\.html$' | sed 's|.*/||;s/.html//' | sort -u | tail -1)"
            echo "report_date=${REPORT_DATE}" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when push is not a daily report
        if: steps.detect.outputs.has_reports != 'true'
        run: echo "No daily report HTML in this push; skipping auto-merge."

      - name: Setup Python
        if: steps.detect.outputs.has_reports == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Merge into main, validate, push
        if: steps.detect.outputs.has_reports == 'true'
        env:
          REPORT_DATE: ${{ steps.detect.outputs.report_date }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull origin main

          if git merge "$SOURCE_SHA" -m "chore: auto-merge daily reports from ${SOURCE_BRANCH}"; then
            echo "Merged ${SOURCE_SHA} into main."
          else
            echo "Merge failed; cherry-picking commits..."
            git merge --abort
            for sha in $(git rev-list --reverse origin/main.."$SOURCE_SHA"); do
              git cherry-pick "$sha"
            done
          fi

          python3 -m unittest discover -s tests -p 'test_*.py' -q
          python3 scripts/validate_report_ui.py --kind AI --date "$REPORT_DATE"
          python3 scripts/validate_report_ui.py --kind STOCK --date "$REPORT_DATE"
          python3 scripts/build_pages_index.py
          git add index.html
          git diff --cached --quiet || git commit -m "chore: rebuild index after auto-merge ${REPORT_DATE}"

          git push origin main
          echo "Pushed main; Publish News Pages workflow will deploy."

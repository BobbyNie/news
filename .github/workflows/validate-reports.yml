name: Validate Daily Reports

on:
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "scripts/validate_report_ui.py"
      - "tests/**"
      - "prompts/**"
      - "assets/**"
  pull_request:
    paths:
      - "**.html"
      - "scripts/validate_report_ui.py"
      - "tests/**"
      - "prompts/**"
      - "assets/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate mobile UI (reports since 20260601)
        run: python scripts/validate_report_ui.py --all-since 20260601
